[project]
name = "biseo-wake"
version = "0.1.0"
description = "Azel always-on wake-word listener for the Mac"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx", "numpy", "sounddevice", "soundfile", "pysilero-vad", "openwakeword"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest"]
