# copy to ~/.config/biseo/wake.toml (every key is optional; these are the defaults)

# Built-in openWakeWord name for testing. When the Korean model is trained, set
#   model = "~/.config/biseo/azel.onnx"
model = "hey_jarvis"
threshold = 0.5

# Personal voice verifier from enrollment (wakes only if base model and verifier both pass).
# "" turns it off; the file is optional and reloaded when it changes.
verifier = ""
verifier_gate = 0.3

server = "http://100.64.0.11:8891"
tts_url = "http://100.64.0.11:8890/v1/audio/speech"
ack_text = "네?"
voice = "sohee"

silence_ms = 600       # silence that ends a request
max_record_s = 15
followup_s = 6         # after a reply, listen this long without the wake word
mute_after_ms = 300    # ignore the mic this long after our own audio stops
vad_threshold = 0.5

# Each detection is logged (time, score, request?, transcript) as JSON lines.
# save_audio = true also keeps the ~2 s around each detection as a WAV next to the log.
save_audio = false
log_path = "~/.local/state/biseo/wake.jsonl"
token_path = "~/.config/biseo/token"

# After "네?", hand the call to the Azel app (azel://wake?persona=<primary>). The mic is open only while the app's
# process runs (app_path); quit the app and the stream is released. "headless" keeps the old always-on
# record -> /v1/turn -> reply flow on the Mac itself.
handoff = "app"
app_path = "/Applications/Azel.app"
# While the app is in a call it keeps this file; the listener ignores the mic then (older than 2 h = stale).
in_call_path = "~/Library/Application Support/Azel/in-call"
gateway = "http://100.64.0.8:8892"  # where the primary persona id comes from (falls back to "azel")

# One-breath commands ("아젤, 내일 날씨 알려줘"): right after the wake word the listener opens the app with
# azel://wake?persona=..&utterance=<id>, keeps capturing (until the app's mic-live file appears,
# end of speech, or the cap) and writes it to wake-utterance-<id>.pcm (16 kHz mono int16, 0600; empty = nobody spoke)
# for the app to send as the first turn. No "네?" ack then. utterance = false: ack + plain azel://wake.
utterance = true
mic_live_path = "~/Library/Application Support/Azel/mic-live"
utterance_dir = "~/Library/Application Support/Azel"
utterance_wait_s = 2
utterance_max_s = 10
utterance_preroll_ms = 160

# While the app's wake-clip recording screen is open it keeps this file; detections are ignored (stale after 30 min).
enrolling_path = "~/Library/Application Support/Azel/enrolling"
enrolling_stale_s = 1800
