# Azel PR page (assistant/site) — a static server block for deneb.
# NPM keeps routing azel.scian.xyz/v1/* to the gateway; send everything else here, e.g. a container:
#   docker run -d --name azel-site --restart unless-stopped -p 127.0.0.1:8088:80 \
#     -v /srv/azel-site:/usr/share/nginx/html:ro -v /srv/azel-site/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
# Copy the folder with:  rsync -a --delete assistant/site/ deneb:/srv/azel-site/
# NPM: proxy host azel.scian.xyz → http://<deneb>:8088 for "/", custom location "/v1" → the gateway as today.
# If NPM adds its own security headers, keep only one copy of each (these are the source of truth).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # One CSP for the whole page: no inline script or style, nothing from other origins.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The deploy notes are in the folder but not part of the site.
    location ^~ /deploy/ { return 404; }

    # No add_header below this line: a location with its own add_header would drop the ones above.
    location = / { try_files /index.html =404; expires epoch; }
    location ~* \.webmanifest$ { default_type application/manifest+json; expires 1h; }
    location ~* \.(css|js|svg|png|ico|txt)$ { try_files $uri =404; expires 1h; }  # not fingerprinted: short cache
    location / { try_files $uri =404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
