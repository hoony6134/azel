name: Biseo
options:
  bundleIdPrefix: xyz.scian
  developmentLanguage: ko # Siri matches the Korean App Shortcut phrases in Intents.swift against this language
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Put your Apple Developer Team ID here (Xcode > Settings > Accounts) before running on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Biseo:
    type: application
    platform: iOS
    sources: [Biseo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.scian.biseo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Biseo/Biseo.entitlements
      properties:
        aps-environment: development
    info:
      path: Biseo/Info.plist
      properties:
        CFBundleDisplayName: 박비서
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 박비서와 통화할 때 목소리를 서버로 보내기 위해 마이크를 사용합니다.
        UIBackgroundModes: [audio, voip]
        # The servers are plain HTTP/WS on Tailscale 100.64.x.x IPs. NSAllowsLocalNetworking does not
        # cover 100.64/10 and Apple's docs say NSExceptionDomains must not hold numeric IPs, so ATS is
        # relaxed app-wide. Traffic only goes to the addresses typed in setup, over the Tailscale tunnel.
        # Switch to MagicDNS names + NSExceptionDomains (or HTTPS) to drop this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  BiseoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BiseoTests]
    dependencies:
      - target: Biseo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Biseo:
    build:
      targets:
        Biseo: all
        BiseoTests: [test]
    test:
      targets: [BiseoTests]
