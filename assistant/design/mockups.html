<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azel Mockups</title>
<style>
/* Tokens: mirror DESIGN.md §2. Dark is the default. */
:root, [data-theme="dark"] {
  --bg:#0D1113; --bgRaised:#131A1D; --card:#182025; --stroke:#26313A;
  --text:#ECF0EC; --text2:#A9B4B0; --text3:#8A9692;
  --celadon:#82CBB4; --indigo:#9AAAF0; --porcelain:#F3EBDC; --amber:#E9BC6E;
  --danger:#FF7A6E; --hangup:#C8342C; --onAccent:#0D1113;
  --glazeCel:#82CBB4; --glazeInd:#9AAAF0; --glazeAmb:#E9BC6E;
  --material: rgba(30,40,45,.55); --page:#070A0B; --desk:#1a2126;
}
[data-theme="light"] {
  --bg:#F5F3EC; --bgRaised:#EFECE3; --card:#FFFFFF; --stroke:#DCD8CC;
  --text:#14191B; --text2:#4E5A56; --text3:#5F6B67;
  --celadon:#2C7663; --indigo:#4656B8; --porcelain:#FFFFFF; --amber:#8F5E12;
  --danger:#C2352B; --hangup:#C8342C; --onAccent:#FFFFFF;
  --glazeCel:#A8DCCB; --glazeInd:#B4BFF3; --glazeAmb:#F0CB86;
  --material: rgba(255,255,255,.6); --page:#E4E1D8; --desk:#cfd6d4;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--page); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  padding:32px 16px 64px; }
header.page { max-width:1320px; margin:0 auto 28px; display:flex; flex-wrap:wrap; gap:16px; align-items:end; justify-content:space-between; }
header.page h1 { font-size:28px; font-weight:600; }
header.page p { color:var(--text2); font-size:15px; margin-top:6px; max-width:640px; line-height:1.5; }
.toggle { font:inherit; font-size:15px; color:var(--text); background:var(--card); border:1px solid var(--stroke); border-radius:999px; padding:10px 18px; cursor:pointer; }
.grid { max-width:1320px; margin:0 auto; display:flex; flex-wrap:wrap; gap:32px; justify-content:center; }
figure { display:flex; flex-direction:column; align-items:center; gap:12px; }
figcaption { color:var(--text2); font-size:13px; font-weight:600; letter-spacing:.02em; }

/* iPhone frame */
.phone { width:390px; height:844px; border-radius:56px; padding:12px; background:#000; box-shadow:0 0 0 2px #2b3338, 0 30px 60px rgba(0,0,0,.35); flex:none; }
@media (max-width:440px){ .phone{ transform:scale(.82); transform-origin:top center; margin-bottom:-150px; } }
.screen { position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; }
.statusbar { height:50px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:6px 30px 0; font-size:15px; font-weight:600; position:relative; z-index:2; }
.island { position:absolute; left:50%; top:11px; transform:translateX(-50%); width:120px; height:34px; background:#000; border-radius:20px; }
.tabbar { flex:none; height:84px; display:flex; justify-content:space-around; padding-top:10px; border-top:1px solid var(--stroke); background:var(--bgRaised); }
.tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text3); position:relative; }
.tab.on { color:var(--celadon); }
.tab svg { width:26px; height:26px; }
.badge { position:absolute; top:-4px; right:-10px; background:var(--danger); color:var(--onAccent); font-size:11px; font-weight:700; border-radius:9px; padding:2px 7px; }
.body { flex:1; overflow:hidden; padding:0 20px; display:flex; flex-direction:column; position:relative; }
.body > * { flex-shrink:0; }
.body > .captions, .body > .stack, .body > .recent { flex-shrink:1; min-height:0; }

/* Shared bits */
.foot { font-size:13px; color:var(--text3); }
.sub { font-size:15px; color:var(--text2); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--celadon); display:inline-block; }
.dot.down { background:var(--danger); }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; border-radius:999px; padding:4px 10px; border:1px solid; }
.chip.qwen { color:var(--celadon); border-color:color-mix(in srgb, var(--celadon) 60%, transparent); background:color-mix(in srgb, var(--celadon) 12%, transparent); }
.chip.claude { color:var(--indigo); border-color:color-mix(in srgb, var(--indigo) 60%, transparent); background:color-mix(in srgb, var(--indigo) 12%, transparent); }
.chip.tool { color:var(--text2); border-color:var(--stroke); font-family:ui-monospace, "SF Mono", Menlo, monospace; font-weight:500; }
.card { background:var(--card); border:1px solid var(--stroke); border-radius:22px; padding:16px; }
[data-theme="light"] .card { box-shadow:0 4px 12px rgba(0,0,0,.05); }
.card h3 { font-size:17px; font-weight:600; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.card h3 small { font-size:13px; font-weight:600; color:var(--celadon); }
.row { display:flex; justify-content:space-between; align-items:center; font-size:17px; padding:9px 0; border-top:1px solid var(--stroke); gap:12px; }
.row:first-of-type { border-top:none; }
.row .v { color:var(--text2); font-variant-numeric:tabular-nums; }
.row .menu { color:var(--celadon); }
.num { font-variant-numeric:tabular-nums; }
canvas.jar { display:block; }

/* Home */
.greet { font-size:28px; font-weight:600; margin-top:14px; line-height:1.3; }
.callbtn { display:flex; align-items:center; justify-content:center; gap:10px; height:64px; border-radius:28px; background:var(--celadon); color:var(--onAccent); font-size:19px; font-weight:600; border:none; width:100%; }
.quick { display:flex; gap:8px; margin-top:12px; }
.quick span { flex:1; display:flex; justify-content:center; align-items:center; gap:6px; height:44px; border:1px solid var(--stroke); border-radius:999px; font-size:15px; color:var(--text); white-space:nowrap; }
.recent { margin-top:22px; }
.recent h4 { font-size:15px; font-weight:600; color:var(--text2); margin-bottom:10px; }
.recent .card { padding:14px 16px; margin-bottom:10px; border-radius:18px; }
.recent .meta { display:flex; justify-content:space-between; margin-bottom:6px; }
.recent .me { color:var(--text2); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.recent .ai { font-size:15px; line-height:1.45; margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* Call */
.call .glaze { position:absolute; inset:0; opacity:.35; pointer-events:none; }
.call[data-state="listening"] .glaze { background:radial-gradient(60% 45% at 50% 30%, var(--celadon), transparent 70%), radial-gradient(50% 40% at 20% 80%, color-mix(in srgb,var(--celadon) 40%, transparent), transparent 70%); }
.call[data-state="thinking"] .glaze { background:radial-gradient(60% 45% at 50% 30%, var(--indigo), transparent 70%), radial-gradient(50% 40% at 85% 75%, color-mix(in srgb,var(--indigo) 40%, transparent), transparent 70%); }
.call[data-state="speaking"] .glaze { background:radial-gradient(60% 45% at 50% 30%, var(--amber), transparent 70%), radial-gradient(50% 40% at 50% 90%, color-mix(in srgb,var(--porcelain) 25%, transparent), transparent 70%); }
.calltop { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:6px 0; position:relative; }
.calltop .t { font-size:13px; color:var(--text2); font-variant-numeric:tabular-nums; }
.calltop .n { font-size:17px; font-weight:600; }
.calltop .r { justify-self:end; }
.statelabel { text-align:center; font-size:17px; font-weight:600; margin-top:6px; display:flex; justify-content:center; align-items:center; gap:6px; position:relative; }
.call[data-state="listening"] .statelabel { color:var(--celadon); }
.call[data-state="thinking"] .statelabel { color:var(--indigo); }
.call[data-state="speaking"] .statelabel { color:var(--amber); }
.jarwrap { display:flex; justify-content:center; position:relative; }
.captions { flex:1; display:flex; flex-direction:column; justify-content:flex-end; text-align:center; gap:10px; padding:0 4px 16px; position:relative;
  -webkit-mask-image:linear-gradient(transparent, #000 30%); mask-image:linear-gradient(transparent, #000 30%); }
.captions .old { color:var(--text3); font-size:17px; line-height:1.45; }
.captions .me { color:var(--text2); font-size:17px; line-height:1.5; }
.captions .ai { font-size:22px; font-weight:500; line-height:1.5; }
.dock { display:flex; justify-content:space-between; padding:12px 14px 10px; border-radius:40px; background:var(--material); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--stroke); position:relative; }
.ctl { display:flex; flex-direction:column; align-items:center; gap:5px; font-size:12px; color:var(--text2); }
.ctl i { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--text) 10%, transparent); color:var(--text); }
.ctl.on i { background:var(--amber); color:#14191B; }
.ctl svg, .hang svg { width:24px; height:24px; }
.hang { width:72px; height:72px; border-radius:50%; background:var(--hangup); color:#fff; display:grid; place-items:center; margin:14px auto 26px; position:relative; }

/* Settings / approvals lists */
.title { font-size:34px; font-weight:700; margin:10px 0 14px; }
.stack { display:flex; flex-direction:column; gap:14px; overflow:hidden; }
.bar { height:6px; border-radius:3px; background:color-mix(in srgb, var(--text) 12%, transparent); position:relative; margin:10px 0 4px; }
.bar b { position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--celadon); }
.bar .tick { position:absolute; top:-3px; width:2px; height:12px; background:var(--amber); }
.big { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
.mini { display:grid; grid-template-columns:70px 1fr 64px; gap:8px; align-items:center; font-size:13px; color:var(--text2); margin-top:8px; }
.mini .b { height:4px; border-radius:2px; background:var(--indigo); }
.mini span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
.code { font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:15px; background:var(--bg); border-radius:12px; padding:12px; margin:10px 0 8px; white-space:pre; overflow:hidden; line-height:1.5; }
.btns { display:flex; gap:10px; margin-top:12px; }
.btns span { flex:1; height:44px; border-radius:14px; display:grid; place-items:center; font-size:17px; font-weight:600; }
.btns .no { border:1px solid var(--stroke); color:var(--danger); }
.btns .yes { background:var(--celadon); color:var(--onAccent); }

/* Mac */
.mac { width:min(1000px, 100%); aspect-ratio:16/10; border-radius:14px; overflow:hidden; position:relative; box-shadow:0 0 0 1px #2b3338, 0 30px 60px rgba(0,0,0,.35);
  background:linear-gradient(160deg, var(--desk), color-mix(in srgb, var(--desk) 60%, #000)); }
.menubar { height:26px; display:flex; align-items:center; justify-content:flex-end; gap:16px; padding:0 14px; font-size:13px; background:color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter:blur(20px); }
.menubar .left { margin-right:auto; display:flex; gap:18px; font-weight:600; }
.menubar .mine { position:relative; color:var(--celadon); display:flex; }
.menubar .mine::after { content:""; position:absolute; right:-3px; top:0; width:6px; height:6px; border-radius:50%; background:var(--danger); }
.popover { position:absolute; right:150px; top:34px; width:340px; background:var(--bgRaised); border:1px solid var(--stroke); border-radius:14px; padding:16px; box-shadow:0 20px 40px rgba(0,0,0,.35); font-size:13px; }
.popover .hd { display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:600; }
.popover .hero { display:flex; gap:12px; align-items:center; margin:14px 0; }
.popover .pbtn { margin-left:auto; background:var(--celadon); color:var(--onAccent); border-radius:999px; padding:7px 14px; font-weight:600; font-size:13px; white-space:nowrap; }
.popover .q { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.popover .q span { border:1px solid var(--stroke); border-radius:10px; padding:8px; text-align:center; }
.popover .appr { margin-top:10px; padding:9px 12px; border-radius:10px; background:color-mix(in srgb, var(--amber) 14%, transparent); color:var(--amber); font-weight:600; display:flex; justify-content:space-between; }
.popover .rec { margin-top:12px; border-top:1px solid var(--stroke); padding-top:10px; }
.popover .rec div { display:flex; gap:10px; padding:5px 0; color:var(--text); }
.popover .rec div span:first-child { color:var(--text3); width:58px; flex:none; font-variant-numeric:tabular-nums; }
.popover .rec div span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.popover .ft { display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--stroke); color:var(--text2); }
.ptt { position:absolute; left:50%; bottom:9%; transform:translateX(-50%); width:460px; max-width:92%; height:112px; border-radius:30px; background:var(--material); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--stroke); display:flex; align-items:center; gap:14px; padding:0 18px 0 14px; box-shadow:0 20px 40px rgba(0,0,0,.3); }
.ptt .cap { flex:1; min-width:0; }
.ptt .cap .me { font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptt .cap .ai { font-size:17px; font-weight:500; line-height:1.4; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ptt .side { display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
.ptt .x { width:28px; height:28px; border-radius:50%; background:color-mix(in srgb, var(--text) 12%, transparent); display:grid; place-items:center; }
.keyhint { position:absolute; left:50%; bottom:calc(9% + 122px); transform:translateX(-50%); font-size:12px; color:var(--text2); background:var(--material); border:1px solid var(--stroke); border-radius:999px; padding:4px 12px; backdrop-filter:blur(10px); white-space:nowrap; }
</style>
</head>
<body>
<header class="page">
  <div>
    <h1>Azel: 달항아리 UI mockups</h1>
    <p>App name "Azel"; "아젤" is the default of the user-editable <code>assistant_name</code>. Tokens follow <code>DESIGN.md</code>. The jars below are drawn with the same shape formula as the SwiftUI spec and driven by simulated audio levels. Reduce Motion in your OS freezes the undulation.</p>
  </div>
  <button class="toggle" id="theme" aria-pressed="false">라이트 모드 보기</button>
</header>

  <symbol id="i-spk" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>

<main class="grid">

<!-- 1. Home / idle -->
<figure>
<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="island"></span><span>100%</span></div>

<!-- 2-4. Call states -->
<template id="call-tpl">
<div class="phone"><div class="screen call">
  <div class="glaze"></div>

<script>
const CALLS = {
  listening: { label:'듣고 있어요', icon:'i-mic', chip:'',
    caps:['<div class="old">10시 랩 미팅, 오후 2시에 과제 마감이 있어요.</div>','<div class="me">아 맞다, 과제 어디까지 했더라</div>'] },
  thinking: { label:'생각 중', icon:'', chip:'',
    caps:['<div class="old">10시 랩 미팅, 오후 2시에 과제 마감이 있어요.</div>','<div class="me">아 맞다, 과제 어디까지 했더라. 노션에 적어 둔 거 확인해 줘</div>'] },
  speaking: { label:'말하는 중', icon:'i-spk', chip:'<span class="chip claude">Claude</span>',
    caps:['<div class="me">아 맞다, 과제 어디까지 했더라. 노션에 적어 둔 거 확인해 줘</div>','<div class="ai">노션 메모로는 3번 문제까지 끝내셨고, 4번은 점화식만 세워 두셨어요.</div>'] },
};
const tpl = document.getElementById('call-tpl');
document.querySelectorAll('figure[data-call]').forEach(fig => {
  const s = fig.dataset.call, c = CALLS[s];
  const node = tpl.content.cloneNode(true);
  const scr = node.querySelector('.call');
  scr.dataset.state = s;
  node.querySelector('.jar').dataset.state = s;
  node.querySelector('.jar').setAttribute('aria-label', '아젤, ' + c.label);
  node.querySelector('.statelabel').innerHTML = (c.icon ? `<svg width="18" height="18"><use href="#${c.icon}"/></svg>` : '<span aria-hidden="true">···</span>') + c.label;
  node.querySelector('.r').innerHTML = c.chip;
  node.querySelector('.captions').innerHTML = c.caps.join('');
  if (s === 'listening') node.querySelector('.ctl').classList.remove('on');
  fig.prepend(node);
});

// Theme toggle
const btn = document.getElementById('theme');
btn.addEventListener('click', () => {
  const light = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  btn.textContent = light ? '다크 모드 보기' : '라이트 모드 보기';
  btn.setAttribute('aria-pressed', String(light));
});

// Moon jar: same formula as DESIGN.md §6.2
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function jarR(th) { return 1 + 0.06*Math.sin(th) - 0.035*Math.cos(2*th) + 0.015*Math.sin(3*th + 0.6); }
function wobble(state, th, t, L) {
  switch (state) {
    case 'listening': return L*(0.05*Math.sin(3*th + 2.1*t) + 0.03*Math.sin(5*th - 3.3*t));
    case 'thinking':  return 0.012*Math.sin(2*th + 1.2*t);
    case 'speaking':  return L*(0.07*Math.sin(2*th + 2.8*t) + 0.025*Math.sin(7*th + 5*t));
    default:          return 0.008*Math.sin(2*th + 0.6*t);
  }
}
// Simulated speech envelope: syllable-rate bumps with pauses.
function level(state, t) {
  if (state !== 'listening' && state !== 'speaking') return 0;
  const syl = Math.max(0, Math.sin(t*(state === 'speaking' ? 9 : 7)));
  const phrase = Math.max(0, Math.sin(t*0.9) + 0.35);
  return Math.min(1, 0.15 + 0.8*syl*phrase);
}
const jars = [...document.querySelectorAll('canvas.jar')].map(c => {
  const dpr = devicePixelRatio || 1, w = c.width, h = c.height;
  c.style.width = w + 'px'; c.style.height = h + 'px';
  c.width = w*dpr; c.height = h*dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  return { c, ctx, w, h, smooth:0, phase:Math.random()*10 };
});
function path(ctx, cx, cy, R, state, t, L, sy=1) {
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const th = i/120*Math.PI*2;
    const r = R*jarR(th)*(1 + wobble(state, th, t, L));
    const x = cx + r*Math.cos(th), y = cy + r*Math.sin(th)*sy;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function draw(j, now) {
  const { ctx, w, h, c } = j, state = c.dataset.state;
  const still = reduce.matches;
  const t = still ? 0 : now/1000 + j.phase;
  let target = level(state, t);
  if (still) target = 0.25;
  j.smooth += (target - j.smooth) * (target > j.smooth ? 0.55 : 0.12); // fast attack, slow release
  const L = still ? 0 : j.smooth;
  const scale = still && (state==='listening'||state==='speaking') ? 1.02 : 1;
  const water = state === 'speaking' && !c.hasAttribute('data-nowater');
  const cx = w/2, cy = water ? h*0.44 : h/2, R = Math.min(w, h) * (water ? 0.27 : 0.32) * scale;
  const cel = css('--glazeCel'), ind = css('--glazeInd'), por = css('--porcelain'), amb = css('--glazeAmb'), t3 = css('--text3');
  const look = {
    idle:      { glow:cel, a:por, b:cel, glowA:0.35 + (still?0:0.1*Math.sin(t*1.05)) },
    listening: { glow:cel, a:por, b:cel, glowA:0.4 + 0.4*L },
    thinking:  { glow:ind, a:por, b:ind, glowA:0.45 + (still?0:0.2*Math.sin(t*4.5)) },
    speaking:  { glow:amb, a:por, b:por, glowA:0.45 + 0.45*L },
    offline:   { glow:t3, a:t3, b:t3, glowA:0 },
  }[state] || {};
  ctx.clearRect(0, 0, w, h);
  // glow
  ctx.save(); ctx.filter = `blur(${Math.round(R*0.35)}px)`; ctx.globalAlpha = look.glowA;
  path(ctx, cx, cy, R*(1.05 + (state==='speaking' ? 0.25*L : 0.08*L)), state, t, L); ctx.fillStyle = look.glow; ctx.fill(); ctx.restore();
  // listening ring
  if (state === 'listening') {
    ctx.save(); ctx.globalAlpha = 0.25 + 0.5*L; ctx.strokeStyle = cel; ctx.lineWidth = 1.2;
    path(ctx, cx, cy, R*(1.12 + 0.1*L), state, t, L); ctx.stroke(); ctx.restore();
  }
  // body
  const g = ctx.createRadialGradient(cx - R*0.2, cy - R*0.35, 0, cx, cy, R*1.25);
  g.addColorStop(0, look.a); g.addColorStop(0.55, look.b); g.addColorStop(1, look.glow);
  path(ctx, cx, cy, R, state, t, L); ctx.fillStyle = g; ctx.globalAlpha = state==='offline' ? 0.4 : 1; ctx.fill(); ctx.globalAlpha = 1;
  // thinking swirl
  if (state === 'thinking' && ctx.createConicGradient) {
    ctx.save(); path(ctx, cx, cy, R, state, t, L); ctx.clip();
    const cg = ctx.createConicGradient(t*Math.PI/2, cx, cy);
    cg.addColorStop(0, 'transparent'); cg.addColorStop(0.35, ind); cg.addColorStop(0.6, 'transparent'); cg.addColorStop(0.85, por); cg.addColorStop(1, 'transparent');
    ctx.filter = `blur(${Math.round(R*0.18)}px)`; ctx.globalAlpha = 0.4; ctx.fillStyle = cg; ctx.fillRect(0, 0, w, h); ctx.restore();
  }
  // speaking water line
  if (water) {
    ctx.save(); ctx.filter = 'blur(8px)'; ctx.globalAlpha = 0.3;
    path(ctx, cx, cy + R*1.6, R*(0.8 + 0.4*L), state, t, L, -0.25); ctx.fillStyle = amb; ctx.fill(); ctx.restore();
  }
}
function frame(now) { jars.forEach(j => draw(j, now)); if (!reduce.matches) requestAnimationFrame(frame); }
requestAnimationFrame(frame);
reduce.addEventListener('change', () => requestAnimationFrame(frame));
btn.addEventListener('click', () => requestAnimationFrame(frame)); // redraw static jars with new theme colors
</script>
