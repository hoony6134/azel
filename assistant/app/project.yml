name: Biseo
options:
  bundleIdPrefix: xyz.scian
  developmentLanguage: ko # Siri matches the Korean App Shortcut phrases in Intents.swift against this language
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2S9H42VJUA # VOID (KR)
    CODE_SIGN_STYLE: Automatic
targets:
  # One multiplatform app: same sources and bundle id for iPhone and Mac. Shared/ builds everywhere;
  # iOS/ (CallKit, PushKit, App Intents, tab UI) and macOS/ (menu bar, hotkey, call panel, wake toggle)
  # build only for their platform.
  Biseo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Biseo/Shared
      - path: Biseo/iOS
        destinationFilters: [iOS]
      - path: Biseo/LiveActivity
        destinationFilters: [iOS]
      - path: Biseo/macOS
        destinationFilters: [macOS]
    dependencies:
      - target: AzelWidgets
        destinationFilters: [iOS]
      - target: AzelWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.scian.biseo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Shared/Assets.xcassets, from assistant/design/icon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Biseo/Biseo-iOS.entitlements # aps-environment
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Biseo/Biseo-macOS.entitlements # sandbox, network client, audio input
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    info:
      path: Biseo/Info.plist
      properties:
        CFBundleDisplayName: Azel
        CFBundleName: Azel # macOS menu/app name; PRODUCT_NAME stays Biseo (module name, test host)
        # Siri needs the app's name in a phrase; these let "아젤 불러줘" and "비서 불러줘" work too.
        INAlternativeAppNames:
          - INAlternativeAppName: 아젤
            INAlternativeAppNamePronunciationHint: 아젤
          - INAlternativeAppName: 비서
            INAlternativeAppNamePronunciationHint: 비서
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Azel로 통화할 때 목소리를 서버로 보내기 위해 마이크를 사용합니다.
        # iOS (ignored on macOS)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip, fetch]
        # iPhone data (PHONE_DATA.md): asked only when that toggle is turned on in Settings → 아이폰 데이터
        BGTaskSchedulerPermittedIdentifiers: [xyz.scian.biseo.phone-sync]
        NSHealthShareUsageDescription: 켜 둔 항목(걸음, 수면, 운동, 심박 등)을 아젤이 읽고 물어보시면 답하기 위해 건강 데이터를 사용합니다.
        NSHealthUpdateUsageDescription: Azel은 건강 데이터를 쓰지 않습니다.
        NSCalendarsFullAccessUsageDescription: 아이폰 캘린더 일정을 물어보시면 답하기 위해 사용합니다.
        NSRemindersFullAccessUsageDescription: 미리 알림에 남은 항목을 물어보시면 답하기 위해 사용합니다.
        NSContactsUsageDescription: 연락처를 이름으로 찾아 달라고 하시면 답하기 위해 사용합니다.
        NSLocationWhenInUseUsageDescription: 지금 어디인지 물어보실 때만 한 번 위치를 확인합니다. 위치를 저장하거나 추적하지 않습니다.
        NSMotionUsageDescription: 위치를 물어보실 때 걷는 중인지, 이동 중인지 함께 알려 드리기 위해 사용합니다.
        NSAppleMusicUsageDescription: 지금 듣는 음악과 최근 들은 곡을 물어보시면 답하기 위해 사용합니다.
        NSSupportsLiveActivities: true
        # Siri's calling intent, handled in the app ("아젤한테 전화해줘", also from a locked phone)
        INIntentsSupported: [INStartCallIntent]
        NSUserActivityTypes: [INStartCallIntent]
        NSSupportsLiveActivitiesFrequentUpdates: true
        # macOS (ignored on iOS): menu-bar only, no Dock icon
        LSUIElement: true
        # azel://task/<id> opens a task (finish notifications deep-link here)
        CFBundleURLTypes:
          - CFBundleURLName: xyz.scian.biseo
            CFBundleURLSchemes: [azel]
        LSApplicationCategoryType: public.app-category.productivity
        # Defaults are https/wss on azel.scian.xyz, so ATS stays on. Plain tailnet http/ws can't be
        # allowed per IP range (NSExceptionDomains takes no numeric IPs). NSAllowsLocalNetworking only
        # lets macOS reach this Mac's own address (checked 2026-11-21: 100.64.0.8 → 401, vd-spark
        # 100.64.0.11 → -1022; iOS refuses both), so the app offers only the TLS addresses.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # Lock Screen / Dynamic Island Live Activities (call, running tasks) and the Azel 부르기 widget. iPhone only.
  AzelWidgets:
    type: app-extension
    platform: iOS
    sources: [Biseo/Widgets, Biseo/LiveActivity, Biseo/CallWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.scian.biseo.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET # ApprovalIntent: the app-only perform body
    info:
      path: Biseo/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Azel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Apple Watch: its own CallKit call over `WS /v1/call` (watchOS only allows the socket during a
  # call), Siri ("아젤 불러줘"), and the Azel 부르기 complication. The iPhone sends the token over
  # WatchConnectivity (iOS/WatchSync.swift).
  AzelWatch:
    type: application
    platform: watchOS
    sources:
      - path: Biseo/Watch
      - path: Biseo/Shared/CallClient.swift
      - path: Biseo/Shared/Audio.swift
      - path: Biseo/Shared/Config.swift
      - path: Biseo/Shared/CallLog.swift
      - path: Biseo/Shared/AssistantName.swift
      - path: Biseo/Shared/Log.swift
      - path: Biseo/Shared/CallEvent.swift
      - path: Biseo/Shared/Activity.swift
      - path: Biseo/Shared/Earcon.swift
      - path: Biseo/Shared/Karaoke.swift
      - path: Biseo/Shared/Recording.swift
      - path: Biseo/Shared/Theme.swift
      - path: Biseo/Shared/MoonJar.swift
    dependencies:
      - target: AzelWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.scian.biseo.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Biseo/Watch/Info.plist
      properties:
        CFBundleDisplayName: Azel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: xyz.scian.biseo
        NSMicrophoneUsageDescription: Azel로 통화할 때 목소리를 서버로 보내기 위해 마이크를 사용합니다.
        UIBackgroundModes: [voip, audio]
        INAlternativeAppNames:
          - INAlternativeAppName: 아젤
            INAlternativeAppNamePronunciationHint: 아젤
          - INAlternativeAppName: 비서
            INAlternativeAppNamePronunciationHint: 비서
        INIntentsSupported: [INStartCallIntent]
        NSUserActivityTypes: [INStartCallIntent]
        CFBundleURLTypes:
          - CFBundleURLName: xyz.scian.biseo
            CFBundleURLSchemes: [azel]
  AzelWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Biseo/WatchWidgets, Biseo/CallWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.scian.biseo.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Biseo/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Azel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BiseoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [BiseoTests]
    dependencies:
      - target: Biseo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Biseo.app/Contents/MacOS/Biseo # xcodegen writes the iOS layout
schemes:
  Biseo:
    build:
      targets:
        Biseo: all
        BiseoTests: [test]
    test:
      targets: [BiseoTests]
