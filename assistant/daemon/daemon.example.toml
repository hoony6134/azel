# Copy to ~/.config/biseo/daemon.toml (chmod 600). Unset keys use the defaults in biseo_daemon.py.
id = "macbook"            # ASCII slug: MCP server name on the Claude side
name = "macbook"          # display name: English, same as the id (macbook, albireo, gienah, deneb, spark)
host = "100.64.0.8"       # Tailscale IP; 0.0.0.0 is refused
port = 8893
token_file = "~/.config/biseo/token"
gateway_url = "http://100.64.0.8:8892"
allowed_roots = ["~/dev"]
# Prefix match on shell-split tokens. Path-like arguments must stay inside allowed_roots.
# No npm/yarn/pnpm run/test: package scripts run arbitrary code (use delegate for that).
allowed_commands = ["git status", "git log", "git diff", "ls", "rg"]
# Matched anywhere in the token list; these are never run without a gateway approval.
approval_required = ["rm", "git push", "git reset --hard", "mv", "chmod", "chown"]
# true on jh-only devices (macbook, albireo, gienah, deneb, ruchba, fawaris): an unlisted command becomes an approval
# request in the app instead of a refusal. false on vd-spark, vd-core and sadr. sudo, secrets, wipes and sh -c are
# refused either way.
approve_unlisted = false
# "gateway" (default): this daemon files and checks approvals with the gateway. "gateway-grant": for team devices
# (vd-spark, vd-core) the gateway can reach but that cannot reach it: run_command answers needs_approval with a nonce
# and runs only against a grant (approval id, device, command, cwd, nonce, exp, HMAC-SHA256 with this daemon's token)
# the gateway signs after the user's tap. A grant never bypasses the hard denies.
approval_via = "gateway"
approval_wait_s = 120
log_path = "~/.local/state/biseo/daemon.jsonl"   # tool-call JSON lines; used_approvals.txt sits beside it
read_max_bytes = 256000
output_max_bytes = 64000
command_timeout = 120
delegate_timeout = 3600
claude_bin = "claude"
# browse(url, selector?, wait_for?, max_chars?): headless Chromium page text. Hosts resolving to loopback,
# link-local, private or Tailscale (100.64/10) addresses are refused unless listed here by exact hostname.
browse_enabled = true
browse_timeout_s = 20     # capped at 20
browse_max_chars = 20000
browse_allow_private = []
# macOS only. music(action, query?, volume?): Apple Music through fixed AppleScript templates (the query goes in as
# argv). macOS asks once to let the daemon control Music (Automation). run_command still cannot run osascript.
music_enabled = true
# home(scene): runs `shortcuts run <name>` for these exact names only (one Shortcut per HomeKit scene, built in
# the Shortcuts app). Empty = home refuses. Keep locks, garage doors and alarms out of this list.
home_shortcuts = []   # e.g. ["azel-lights-off", "azel-movie"]
