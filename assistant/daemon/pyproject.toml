[project]
name = "biseo-daemon"
version = "0.1.0"
description = "Biseo agent daemon: MCP server exposing guarded file, command and delegate tools"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
